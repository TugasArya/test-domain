<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Picture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        .container {
            background: #16213e;
            padding: 20px;
            border-radius: 32px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.3);
            max-width: 90%;
            width: 800px;
        }
        img {
            width: 100%;
            height: auto;
            border-radius: 24px;
            display: block;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .caption {
            text-align: center;
            margin-top: 20px;
            color: #e2e2e2;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }
        a {
            color: #4fc3f7;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="val.jpg" alt="Your picture description">
        <div class="caption">
            ✨ Your caption here — <a href="#">yourdomain.com</a>
        </div>
    </div>
</body>
</html>
